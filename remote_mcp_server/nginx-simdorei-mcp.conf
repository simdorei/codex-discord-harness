limit_req_zone $binary_remote_addr zone=oauth_per_ip:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=mcp_per_ip:10m;
limit_conn_zone "mcp_total_key" zone=mcp_total:10m;
limit_conn_zone $binary_remote_addr zone=bridge_per_ip:10m;
limit_conn_zone "bridge_total_key" zone=bridge_total:10m;

server {
    server_name simdorei.duckdns.org;

    client_max_body_size 10m;
    client_header_timeout 15s;
    client_body_timeout 30s;

    location = /healthz {
        proxy_pass http://127.0.0.1:8030/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        proxy_intercept_errors on;
        error_page 502 503 504 = @mcp_not_ready;
    }

    location = /mcp {
        limit_conn mcp_per_ip 20;
        limit_conn mcp_total 200;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3700s;
        proxy_send_timeout 3700s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @mcp_not_ready;
    }

    location ~ ^/(authorize|token|register|revoke|oauth/approve)$ {
        limit_req zone=oauth_per_ip burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_intercept_errors on;
        error_page 502 503 504 = @mcp_not_ready;
    }

    location ~ ^/\.well-known/oauth-(authorization-server|protected-resource/mcp)$ {
        proxy_pass http://127.0.0.1:8030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_intercept_errors on;
        error_page 502 503 504 = @mcp_not_ready;
    }

    location = /bridge {
        limit_conn bridge_per_ip 32;
        limit_conn bridge_total 64;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8030/bridge;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3700s;
        proxy_send_timeout 3700s;
    }

    location @mcp_not_ready {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"ok":false,"error":"mcp_not_ready"}\n';
    }

    location / {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 404 '{"ok":false,"error":"not_found"}\n';
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/simdorei.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/simdorei.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = simdorei.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name simdorei.duckdns.org;
    return 404; # managed by Certbot
}
