name: Windows contract

on:
  push:
  pull_request:

jobs:
  windows-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Compile Windows runtime boundaries
        run: >-
          python -m py_compile
          setup_discord_bot.py
          codex_desktop_bridge.py
          codex_desktop_bridge_impl.py
          codex_discord_bot.py
          codex_discord_store.py
          codex_discord_store_connection.py
          codex_discord_store_schema.py
      - name: Verify installer contracts
        run: >-
          python -m unittest
          tests.test_desktop_requirements_lock
          tests.test_install_scripts
          tests.test_windows_contract_workflow
      - name: Verify desktop bridge contracts
        run: >-
          python -m unittest
          tests.test_codex_desktop_bridge_type_exports
          tests.test_codex_desktop_bridge_cli
          tests.test_codex_desktop_bridge_command_ask
      - name: Verify durable store contracts
        run: >-
          python -m unittest
          tests.test_codex_discord_store_connection
          tests.test_codex_discord_store_schema
          tests.test_codex_discord_store_queue
          tests.test_codex_discord_store_busy
          tests.test_codex_discord_store_mirror_cleanup
      - name: Verify Windows installer dry-run
        shell: powershell
        run: >-
          .\install.ps1 -DryRun -SkipDependencies -SkipEnvFile -SkipCodexPlugin
